services:
  django:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app/palestra
    # TODO: Aggiungi env_file: .env per caricare le variabili d'ambiente
    # TODO: Aggiungi depends_on con condizione service_healthy per db e redis
    command: python manage.py runserver 0.0.0.0:8000

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: palestra_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # TODO: Aggiungi healthcheck con pg_isready
    # healthcheck:
    #   test: ["CMD-SHELL", "..."]
    #   interval: 5s
    #   retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:

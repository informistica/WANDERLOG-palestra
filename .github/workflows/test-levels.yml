name: Test Palestra Levels

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-levels:
    name: Test Level ${{ matrix.level }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        level:
          - "01_ambiente"
          - "02_modelli"
          - "03_servizi"
          - "04_permessi"
          - "05_api"
          - "06_htmx"
          - "07_mappa"
          - "08_celery"
          - "09_channels"
          - "10_email"
          - "11_testing"
          - "12_teamwork"
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: palestra_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    defaults:
      run:
        working-directory: ${{ matrix.level }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext
      
      - name: Check if level directory exists
        id: check_dir
        run: |
          if [ -d "${{ github.workspace }}/${{ matrix.level }}/palestra" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Install Python dependencies
        if: steps.check_dir.outputs.exists == 'true'
        working-directory: ${{ matrix.level }}
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
            pip install pytest pytest-django
          fi
      
      - name: Create .env file
        if: steps.check_dir.outputs.exists == 'true'
        working-directory: ${{ matrix.level }}
        run: |
          cat > .env << EOF
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY || 'test-secret-key-for-ci-only-change-me-in-production-12345678901234567890' }}
          DEBUG=True
          ALLOWED_HOSTS=localhost,127.0.0.1
          DATABASE_URL=postgres://user:password@localhost:5432/palestra_db
          REDIS_URL=redis://localhost:6379/0
          CELERY_BROKER_URL=redis://localhost:6379/0
          EOF
      
      - name: Run tests
        if: steps.check_dir.outputs.exists == 'true'
        working-directory: ${{ matrix.level }}/palestra
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'test-secret-key-for-ci-only-change-me-in-production-12345678901234567890' }}
          DEBUG: 'True'
          DATABASE_URL: postgres://user:password@localhost:5432/palestra_db
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
        run: |
          # Esegui migrazioni se necessario
          if [ -f manage.py ]; then
            python manage.py migrate --no-input || true
          fi
          
          # Esegui test
          if [ -d tests ]; then
            pytest -v || echo "::warning title=Level ${{ matrix.level }}::Tests failed - this is expected until students complete the TODOs"
          else
            echo "::notice title=Level ${{ matrix.level }}::No tests directory found"
          fi
      
      - name: Check Django configuration
        if: steps.check_dir.outputs.exists == 'true'
        working-directory: ${{ matrix.level }}/palestra
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'test-secret-key-for-ci-only' }}
          DEBUG: 'True'
          DATABASE_URL: postgres://user:password@localhost:5432/palestra_db
        run: |
          if [ -f manage.py ]; then
            python manage.py check || echo "::warning title=Level ${{ matrix.level }}::Django check failed"
          fi

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: test-levels
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Palestra Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Test suite eseguita per tutti i livelli." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Nota**: È normale che alcuni test falliscano finché gli studenti non completano i TODO." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "I test servono come auto-verifica per gli studenti." >> $GITHUB_STEP_SUMMARY

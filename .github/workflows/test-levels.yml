name: Test Palestra Levels

# La CI gira sul codice STARTER: i test dei TODO di ogni livello falliscono
# per costruzione, quindi qui si eseguono solo i "test di controllo" (quelli
# dei livelli precedenti, che lo starter cumulativo deve gia' superare) piu'
# manage.py check, migrate e, dove c'e' gia' un contratto, lint-imports.
# Qualsiasi errore fa fallire il job. Elenco test di controllo: README del livello.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  starter:
    name: Starter ${{ matrix.level }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - level: 01_ambiente
            control: tests/test_environment.py
            lint: false
          - level: 02_modelli
            control: tests/test_environment.py tests/test_docker_config.py
            lint: false
          - level: 03_servizi
            control: tests/test_environment.py tests/test_docker_config.py tests/test_models.py tests/test_admin.py tests/test_migrations.py
            lint: false

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: palestra_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd "pg_isready -U user -d palestra_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdef
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://user:password@localhost:5432/palestra_db
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0

    defaults:
      run:
        working-directory: ${{ matrix.level }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.level }}/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Create .env
        run: |
          cat > .env <<EOF
          DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY
          DEBUG=$DEBUG
          ALLOWED_HOSTS=$ALLOWED_HOSTS
          DATABASE_URL=$DATABASE_URL
          REDIS_URL=$REDIS_URL
          CELERY_BROKER_URL=$CELERY_BROKER_URL
          EOF

      - name: Django check
        working-directory: ${{ matrix.level }}/palestra
        run: python manage.py check

      - name: Migrate
        working-directory: ${{ matrix.level }}/palestra
        run: python manage.py migrate --no-input

      - name: lint-imports
        if: matrix.lint
        working-directory: ${{ matrix.level }}/palestra
        run: lint-imports

      - name: Control tests (livelli precedenti)
        working-directory: ${{ matrix.level }}/palestra
        run: pytest -v ${{ matrix.control }}